# Render Blueprint (opcional) — despliegue automatizado de los 3 servicios + PostgreSQL
# Puedes importar este archivo en Render Dashboard → Blueprints

databases:
  - name: analyticore-db
    plan: free
    databaseName: analyticore
    user: analyticore

services:
  - type: web
    name: analyticore-java
    runtime: docker
    dockerfilePath: ./java-service/Dockerfile
    dockerContext: ./java-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analyticore-db
          property: connectionString

  - type: web
    name: analyticore-python
    runtime: docker
    dockerfilePath: ./python-service/Dockerfile
    dockerContext: ./python-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: analyticore-db
          property: connectionString
      - key: JAVA_SERVICE_URL
        fromService:
          name: analyticore-java
          type: web
          property: hostport

  - type: web
    name: analyticore-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: analyticore-python
          type: web
          property: hostport
