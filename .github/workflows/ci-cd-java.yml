name: CI/CD Java Service

on:
  push:
    branches:
      - main
    paths:
      - 'java-service/**'
      - '.github/workflows/ci-cd-java.yml'

jobs:
  build-test-scan-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: |
          cd java-service
          mvn test

      - name: Build Docker Image
        run: |
          cd java-service
          docker build -t naimad201/analyticore-java:latest .

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'naimad201/analyticore-java:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image to Registry
        run: docker push naimad201/analyticore-java:latest

      - name: Trigger Render Deployment (Staging / Prod)
        # run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_JAVA }}
        run: echo "Trigger Webhook Render (Comentado hasta tener la URL)"
