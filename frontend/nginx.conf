# Nginx — Capa de Infraestructura del Frontend.
# Sirve los archivos estáticos compilados por Vite (carpeta dist/).
# No participa en la comunicación REST — eso lo hace el navegador → services/api.js → Python.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve assets estáticos del build de React (JS, CSS)
    location /assets/ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
