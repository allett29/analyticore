# La URL, usuario y contraseña se resuelven en DatabaseConfig.java
# para soportar el formato de Render (postgres:// sin puerto explícito)
spring.datasource.driver-class-name=org.postgresql.Driver

# update: crea la tabla 'jobs' si no existe (necesario cuando Java arranca antes que Python en Render)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
