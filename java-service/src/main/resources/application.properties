# Configuración de PostgreSQL — la URL se resuelve en DatabaseConfig.java
# para soportar el formato postgres:// de Render y jdbc: de docker-compose
spring.datasource.username=${DATABASE_USER:analyticore}
spring.datasource.password=${DATABASE_PASSWORD:analyticore}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
