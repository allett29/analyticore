# Entorno local completo: simula la arquitectura de producción en Render
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyticore
      POSTGRES_PASSWORD: analyticore
      POSTGRES_DB: analyticore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyticore -d analyticore"]
      interval: 5s
      timeout: 5s
      retries: 5

  java-service:
    build: ./java-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/analyticore
      DATABASE_USER: analyticore
      DATABASE_PASSWORD: analyticore
    depends_on:
      postgres:
        condition: service_healthy

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analyticore:analyticore@postgres:5432/analyticore
      JAVA_SERVICE_URL: http://java-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      java-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_PYTHON_URL: http://localhost:8000
        VITE_JAVA_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - python-service

volumes:
  postgres_data:
